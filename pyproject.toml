[project]
name = "gigbid"
version = "0.1.0"
description = "GigBid: a multi-agent freelancer copilot (AI-4016 Assignment II)"
requires-python = ">=3.11"
# Versions pinned to what was tested; see requirements.lock for the full freeze.
dependencies = [
  "fastapi==0.121.*",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4",
  "pyyaml>=6",
  "httpx>=0.27",
  "python-dotenv>=1",
  "langgraph>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain-mcp-adapters>=0.1",
  "langgraph-checkpoint-postgres>=3",
  "langgraph-supervisor>=0.0.29",
  "mcp>=1.20",
  "psycopg[binary,pool]>=3.2",
  "sqlalchemy>=2",
  "arq>=0.26",
  "sse-starlette>=2",
  "fastembed>=0.4",
  "bm25s>=0.2",
  "numpy>=1.26",
  "pandas>=2",
  "pyarrow>=15",
  "kagglehub>=0.3",
  "cryptography>=43",
  "langsmith>=0.2",
  "scipy>=1.13",
  "python-multipart>=0.0.9",
  "redis>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
gigbid-portfolio-mcp = "mcp_servers.portfolio.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "rag*", "mcp_servers*", "gigsim*", "worker*", "apps*", "evals*", "scripts*"]

[tool.ruff]
line-length = 110
extend-exclude = ["apps/web", ".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "mcp_servers"]
