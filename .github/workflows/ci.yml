name: CI
on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: gigbid }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gigbid
      REDIS_URL: redis://localhost:6379/0
      MODEL_PROFILE: offline
      GIGSIM_ERROR_RATE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Lint and repo rules (no secrets, gigsim unchanged, prompts in agent/prompts, README numbers traced)
        run: |
          ruff check .
          python -m scripts.check_repo
      - name: Build indexes
        run: python -m rag.ingest.build
      - name: Start GigSim and MCP servers
        run: |
          nohup uvicorn gigsim.app:app --port 8081 > gigsim.log 2>&1 &
          nohup python -m scripts.run_mcp_servers > mcp.log 2>&1 &
          sleep 15
      - name: Unit, contract and integration tests
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run gen:api && git diff --exit-code src/lib/api/schema.d.ts
      - run: npx tsc -b
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: apps/web/playwright-report }
